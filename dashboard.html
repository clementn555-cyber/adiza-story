<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Admin — Adiza Story</title>

  <link
    rel="stylesheet"
    href="../css/style.css"
  >

</head>


<body>

  <!-- ========================================= -->
  <!-- HEADER -->
  <!-- ========================================= -->

  <header class="site-header">

    <a
      class="logo"
      href="../index.html"
    >
      Adiza <span>Story</span>
    </a>


    <nav>

      <a
        class="active"
        href="dashboard.html"
      >
        Dashboard
      </a>


      <a href="nouvelle-histoire.html">
        Nouvelle histoire
      </a>


      <a href="../index.html">
        Voir le site
      </a>


      <button
        type="button"
        onclick="logoutAdmin()"
      >
        🚪 Déconnexion
      </button>

    </nav>

  </header>



  <!-- ========================================= -->
  <!-- CONTENU -->
  <!-- ========================================= -->

  <main class="admin-wrap">

    <p class="eyebrow">
      ADMINISTRATION
    </p>


    <h1>
      Tableau de bord
    </h1>



    <!-- ========================================= -->
<!-- STATISTIQUES -->
<!-- ========================================= -->

<div class="category-grid">

  <!-- TOTAL -->

  <div class="category-card">

    <span>
      📚
    </span>

    <h3 id="count">
      0
    </h3>

    <p>
      Histoires
    </p>

  </div>


  <!-- PUBLIÉES -->

  <div class="category-card">

    <span>
      🟢
    </span>

    <h3 id="publishedCount">
      0
    </h3>

    <p>
      Publiées
    </p>

  </div>


  <!-- BROUILLONS -->

  <div class="category-card">

    <span>
      📝
    </span>

    <h3 id="draftCount">
      0
    </h3>

    <p>
      Brouillons
    </p>

  </div>

</div>



    <!-- ========================================= -->
    <!-- LISTE DES HISTOIRES -->
    <!-- ========================================= -->

    <div
      class="admin-card"
      style="margin-top:25px"
    >

      <div class="section-heading">

        <h2>
          📚 Mes histoires
        </h2>


        <a
          class="btn"
          href="nouvelle-histoire.html"
        >
          + Nouvelle histoire
        </a>

      </div>

      <div
  style="
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
  "
>

  <input
    type="search"
    id="searchStories"
    placeholder="🔎 Rechercher une histoire..."
    style="
      flex:1;
      min-width:220px;
    "
  >

  <select
    id="statusFilter"
    style="
      min-width:180px;
    "
  >
    <option value="all">
      📚 Toutes
    </option>

    <option value="published">
      🟢 Publiées
    </option>

    <option value="draft">
      📝 Brouillons
    </option>
  </select>

  <select
    id="genreFilter"
    style="
      min-width:180px;
    "
  >
    <option value="all">
      📖 Tous les genres
    </option>

    <option value="Romance">
      ❤️ Romance
    </option>

    <option value="Horreur">
      👻 Horreur
    </option>

    <option value="Dark Romance">
      🖤 Dark Romance
    </option>

    <option value="Fantasmes">
      ✨ Fantasmes
    </option>
  </select>

</div>


      <div id="list">

        <p>
          Chargement des histoires...
        </p>

      </div>

    </div>

  </main>



  <!-- ========================================= -->
  <!-- SUPABASE -->
  <!-- ========================================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../js/config.js"></script>

  <script src="../js/supabase.js"></script>

  <script src="admin.js"></script>

</body>

</html>
