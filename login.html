<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connexion — Adiza Story</title>

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <main class="login-container">

    <section class="login-card">

      <h1>📖 Adiza Story</h1>

      <h2>Administration</h2>

      <p>
        Connecte-toi pour gérer tes histoires.
      </p>

      <form id="loginForm">

        <div class="form-group">

          <label for="email">
            Adresse e-mail
          </label>

          <input
            type="email"
            id="email"
            placeholder="admin@email.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Mot de passe
          </label>

          <input
            type="password"
            id="password"
            placeholder="Mot de passe"
            autocomplete="current-password"
            required
          >

        </div>


        <button type="submit">
          🔐 Se connecter
        </button>

        <div id="message"></div>

      </form>

    </section>

  </main>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- CONFIGURATION -->
  <script src="../js/config.js"></script>

  <!-- CLIENT SUPABASE -->
  <script src="../js/supabase.js"></script>

  <!-- CONNEXION ADMIN -->
  <script src="login.js"></script>

</body>
